<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jay Vale | Heartship Records</title>
  <style>
    body {
      margin: 0;
      background: #050505;
      color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
      background: radial-gradient(circle at center, #222 0%, #050505 60%);
    }

    .box {
      max-width: 850px;
    }

    h1 {
      font-size: 64px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    h2 {
      font-weight: normal;
      color: #aaa;
      margin-bottom: 30px;
    }

    p {
      font-size: 20px;
      line-height: 1.7;
      color: #ddd;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 28px;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      letter-spacing: 1px;
    }

    .button:hover {
      background: #fff;
      color: #000;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="box">
      <h1>JAY VALE</h1>
      <h2>Songwriter · Performing Artist · Producer</h2>
      <p>
        Music made from survival, coping, pressure, numbness, honesty,
        and the fight to turn damage into something people can feel.
      </p>
      <a class="button" href="#">Heartship Records</a>
    </div>
  </section>
</body>
</html>
